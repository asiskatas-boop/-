<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FF69B4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Filakia 💋</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  body {
    background: linear-gradient(160deg, #ffe6f0 0%, #ffd1e3 40%, #ffb8d1 100%);
    color: #2d2d2d;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; align-items: center; justify-content: center;
  }

  #send-view { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 8px; overflow-y: auto; }
  .controls { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 340px; }

  .header { text-align: center; }
  .header h1 { font-size: 20px; font-weight: 700; color: #c2185b; }

  .card {
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 2px 12px rgba(194,24,91,0.08);
    border: 1px solid rgba(255,255,255,0.9);
  }

  .section-label { font-size: 9px; font-weight: 700; color: #b088a0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }

  /* Tabs */
  .tabs { display: flex; gap: 5px; }
  .tabs button {
    flex: 1;
    padding: 9px 4px;
    border-radius: 10px;
    border: 1.5px solid #f0d0e0;
    background: white;
    font-size: 12px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tabs button.active {
    background: linear-gradient(135deg, #FF69B4, #e91e63);
    color: white;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(233,30,99,0.25);
  }

  /* Preview */
  #preview-area {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70px;
    padding: 4px;
  }

  #preview-icon { width: 70px; height: 70px; filter: drop-shadow(0 4px 10px rgba(233,30,99,0.2)); }

  #preview-hug { font-size: 56px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(233,30,99,0.2)); }

  #draw-canvas {
    width: 100%;
    max-width: 300px;
    height: 140px;
    border-radius: 12px;
    background: white;
    touch-action: none;
    cursor: crosshair;
    box-shadow: inset 0 0 0 1.5px #f0d0e0;
    display: none;
  }

  /* Colors */
  .color-row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .color-dot {
    width: 100%; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; transition: all 0.15s;
  }
  .color-dot.selected { border-color: #2d2d2d; transform: scale(1.2); }

  #custom-color { width: 100%; height: 30px; border: none; border-radius: 8px; cursor: pointer; background: white; margin-top: 5px; }

  /* Photo row */
  .photo-row { display: flex; align-items: center; gap: 8px; }
  .media-btn {
    flex: 1; padding: 9px; border-radius: 10px;
    border: 1.5px dashed #f0a0c0; background: white;
    font-size: 12px; font-weight: 500; color: #c2185b;
    cursor: pointer; text-align: center;
  }
  #preview-img { width: 42px; height: 42px; border-radius: 10px; display: none; object-fit: cover; }
  #preview-img.show { display: block; }
  #file-input { display: none; }

  /* Location */
  .loc-toggle { display: flex; gap: 5px; }
  .loc-toggle button {
    flex: 1; padding: 7px 4px; border-radius: 8px;
    border: 1.5px solid #f0d0e0; background: white;
    font-size: 11px; font-weight: 600; color: #666;
    cursor: pointer; transition: all 0.15s;
  }
  .loc-toggle button.active {
    background: linear-gradient(135deg, #FF69B4, #e91e63);
    color: white; border-color: transparent;
  }
  #custom-loc {
    display: none; width: 100%; padding: 7px 10px;
    border-radius: 8px; border: 1.5px solid #f0d0e0;
    font-size: 12px; margin-top: 5px; background: white;
  }
  #custom-loc.show { display: block; }
  #custom-loc:focus { outline: none; border-color: #FF69B4; }

  #send-btn {
    padding: 14px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #FF69B4 0%, #e91e63 100%);
    color: white; font-size: 16px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(233,30,99,0.35);
    transition: all 0.15s;
  }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.6; }

  #notif-btn {
    padding: 7px; border-radius: 10px;
    border: 1.5px solid #FF69B4; background: transparent;
    color: #FF69B4; font-size: 10px; font-weight: 500;
    cursor: pointer;
  }
  #notif-btn.on { background: linear-gradient(135deg, #FF69B4, #e91e63); color: white; border-color: transparent; }

  /* Receive */
  #receive-view {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; width: 100%; height: 100%;
    padding: 20px; gap: 16px; animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #kiss-display { width: 140px; height: 140px; filter: drop-shadow(0 8px 20px rgba(233,30,99,0.25)); }
  #kiss-display.bounce { animation: kissPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes kissPop { 0% { transform: scale(0.5); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

  #hug-display { font-size: 130px; line-height: 1; display: none; }
  #hug-display.bounce { animation: kissPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }

  #location-display {
    color: #666; font-size: 13px; text-align: center;
    max-width: 90vw; padding: 8px 14px;
    background: rgba(255,255,255,0.7); border-radius: 12px;
    line-height: 1.5; word-break: break-word;
  }
  #location-display a { color: #e91e63; text-decoration: none; font-weight: 500; }
  #location-display img { max-width: min(80vw, 280px); max-height: 40vh; border-radius: 14px; margin-top: 8px; display: block; object-fit: contain; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

  #back-btn { padding: 10px 24px; border-radius: 12px; border: none; background: rgba(255,255,255,0.9); color: #c2185b; font-size: 13px; font-weight: 600; cursor: pointer; }

  .hidden { display: none !important; }

  @media (max-width: 380px) {
    .controls { gap: 7px; }
    .card { padding: 7px; border-radius: 12px; }
    .header h1 { font-size: 17px; }
    .tabs button { padding: 8px 3px; font-size: 11px; }
    #preview-icon { width: 60px; height: 60px; }
    #preview-hug { font-size: 48px; }
    #draw-canvas { height: 120px; }
    .loc-toggle button { padding: 6px 3px; font-size: 10px; }
    .media-btn { padding: 8px; font-size: 11px; }
    #send-btn { padding: 12px; font-size: 15px; }
  }
</style>
</head>
<body>

<div id="send-view">
  <div class="controls">
    <div class="header"><h1>Send Love 💕</h1></div>

    <div class="card">
      <div class="tabs" id="tabs">
        <button data-type="kiss" class="active">💋 Kiss</button>
        <button data-type="hug">🤗 Hug</button>
        <button data-type="draw">✏️ Draw</button>
      </div>
      <div id="preview-area">
        <svg id="preview-icon" viewBox="0 0 24 24" fill="#FF69B4"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <div id="preview-hug" style="display:none">🤗</div>
        <canvas id="draw-canvas"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Color</div>
      <div class="color-row" id="color-row"></div>
      <input type="color" id="custom-color" value="#FF69B4">
    </div>

    <div class="card">
      <div class="section-label">Photo</div>
      <div class="photo-row">
        <button class="media-btn" onclick="document.getElementById('file-input').click()">📷 Add photo / GIF</button>
        <img id="preview-img">
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="card">
      <div class="section-label">Location</div>
      <div class="loc-toggle" id="loc-toggle">
        <button data-mode="off" class="active">Off</button>
        <button data-mode="gps">GPS</button>
        <button data-mode="text">Type</button>
      </div>
      <input type="text" id="custom-loc" placeholder="Type a location...">
    </div>

    <button id="notif-btn">🔔 Enable Notifications</button>
    <button id="send-btn">SEND 💕</button>
  </div>
</div>

<div id="receive-view" class="hidden">
  <svg id="kiss-display" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  <div id="hug-display">🤗</div>
  <div id="location-display"></div>
  <button id="back-btn">← Send another</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getMessaging, getToken, onMessage }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js';

const firebaseConfig = {
  apiKey: "AIzaSyBMsCKD2XexYnzfe1DXKF6mJMZ5P21k2Fw",
  authDomain: "filaki.firebaseapp.com",
  projectId: "filaki",
  storageBucket: "filaki.firebasestorage.app",
  messagingSenderId: "1067934466927",
  appId: "1:1067934466927:web:a22eaae83ebc4e2d975e9a"
};

const IMGBB_KEY = 'ΒΑΛΕ_ΕΔΩ_ΤΟ_IMGBB_KEY';
const VAPID_KEY = 'ΒΑΛΕ_ΕΔΩ_ΤΟ_VAPID_KEY';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedType = 'kiss';
let selectedColor = '#FF69B4';
let locMode = 'off';
let selectedFile = null;
let lastSendTime = 0;

const colors = [
  '#FF69B4','#FF0000','#FF1493','#800080','#9400D3',
  '#0000FF','#00BFFF','#00CED1','#00FF00','#008000',
  '#FFD700','#FFA500','#FF8C00','#8B4513','#000000',
  '#808080','#FFFFFF','#FFC0CB','#E6E6FA','#40E0D0'
];

// === Color dots ===
const colorRow = document.getElementById('color-row');
colors.forEach(c => {
  const dot = document.createElement('div');
  dot.className = 'color-dot' + (c === selectedColor ? ' selected' : '');
  dot.style.background = c;
  if (c === '#FFFFFF') dot.style.border = '2px solid #eee';
  dot.onclick = () => {
    selectedColor = c;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    dot.classList.add('selected');
    applyColor();
  };
  colorRow.appendChild(dot);
});

function applyColor() {
  document.getElementById('preview-icon').setAttribute('fill', selectedColor);
  ctx.strokeStyle = selectedColor;
}

document.getElementById('custom-color').addEventListener('input', e => {
  selectedColor = e.target.value;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  applyColor();
});

// === Tabs ===
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  selectedType = btn.dataset.type;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
});

function updatePreview() {
  const svg = document.getElementById('preview-icon');
  const hug = document.getElementById('preview-hug');
  const canvas = document.getElementById('draw-canvas');

  if (selectedType === 'kiss') {
    svg.style.display = 'block';
    hug.style.display = 'none';
    canvas.style.display = 'none';
  } else if (selectedType === 'hug') {
    svg.style.display = 'none';
    hug.style.display = 'block';
    canvas.style.display = 'none';
  } else {
    svg.style.display = 'none';
    hug.style.display = 'none';
    canvas.style.display = 'block';
  }
}

// === Drawing canvas ===
const canvas = document.getElementById('draw-canvas');
canvas.width = 600;
canvas.height = 300;
const ctx = canvas.getContext('2d');
ctx.lineWidth = 6;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = selectedColor;

let drawing = false;
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}
canvas.addEventListener('pointerdown', e => {
  drawing = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});
canvas.addEventListener('pointerup', () => drawing = false);
canvas.addEventListener('pointercancel', () => drawing = false);

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
function isCanvasEmpty() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < data.length; i += 4) if (data[i] !== 0) return false;
  return true;
}

// === Location ===
document.getElementById('loc-toggle').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  locMode = e.target.dataset.mode;
  document.querySelectorAll('#loc-toggle button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('custom-loc').classList.toggle('show', locMode === 'text');
});

// === Photo ===
document.getElementById('file-input').addEventListener('change', e => {
  selectedFile = e.target.files[0] || null;
  const preview = document.getElementById('preview-img');
  if (selectedFile) {
    preview.src = URL.createObjectURL(selectedFile);
    preview.classList.add('show');
  } else preview.classList.remove('show');
});

async function uploadToImgBB(formData) {
  try {
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
    const data = await res.json();
    return data.data ? data.data.url : null;
  } catch { return null; }
}

// === Send ===
document.getElementById('send-btn').addEventListener('click', async () => {
  const now = Date.now();
  if (now - lastSendTime < 1000) return;
  lastSendTime = now;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending...';

  let location = null;
  if (locMode === 'gps') {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 }));
      location = { type: 'gps', lat: pos.coords.latitude, lon: pos.coords.longitude };
    } catch {}
  } else if (locMode === 'text') {
    const text = document.getElementById('custom-loc').value.trim();
    if (text) location = { type: 'text', label: text };
  }

  let mediaUrl = null;
  if (selectedType === 'draw' && !isCanvasEmpty()) {
    const base64 = canvas.toDataURL('image/png').split(',')[1];
    const fd = new FormData();
    fd.append('image', base64);
    mediaUrl = await uploadToImgBB(fd);
  } else if (selectedFile) {
    const fd = new FormData();
    fd.append('image', selectedFile);
    mediaUrl = await uploadToImgBB(fd);
  }

  await addDoc(collection(db, 'kisses'), {
    type: selectedType,
    color: selectedColor,
    location,
    mediaUrl,
    time: now
  });

  selectedFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('preview-img').classList.remove('show');
  document.getElementById('custom-loc').value = '';
  clearCanvas();
  sendBtn.disabled = false;
  sendBtn.textContent = 'SEND 💕';

  showReceive({ type: selectedType, color: selectedColor, location, mediaUrl });
});

// === Receive ===
function showReceive(k) {
  document.getElementById('send-view').classList.add('hidden');
  document.getElementById('receive-view').classList.remove('hidden');

  const svg = document.getElementById('kiss-display');
  const hug = document.getElementById('hug-display');

  svg.classList.remove('bounce');
  hug.classList.remove('bounce');

  if (k.mediaUrl) {
    svg.style.display = 'none';
    hug.style.display = 'none';
  } else if (k.type === 'hug') {
    svg.style.display = 'none';
    hug.style.display = 'block';
    void hug.offsetWidth;
    hug.classList.add('bounce');
  } else {
    svg.style.display = 'block';
    hug.style.display = 'none';
    svg.querySelector('path').setAttribute('fill', k.color || '#FF69B4');
    void svg.offsetWidth;
    svg.classList.add('bounce');
  }

  let html = '';
  if (k.location) {
    if (k.location.type === 'gps') {
      html += `<a href="https://maps.google.com/?q=${k.location.lat},${k.location.lon}" target="_blank">📍 ${k.location.lat.toFixed(3)}, ${k.location.lon.toFixed(3)}</a>`;
    } else if (k.location.type === 'text') {
      html += `📍 ${k.location.label}`;
    }
  }
  if (k.mediaUrl) html += `<img src="${k.mediaUrl}">`;
  document.getElementById('location-display').innerHTML = html || (k.type === 'hug' ? '🤗 A hug for you' : '💕');
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('receive-view').classList.add('hidden');
  document.getElementById('send-view').classList.remove('hidden');
});

const q = query(collection(db, 'kisses'), orderBy('time', 'desc'), limit(1));
let firstLoad = true;
onSnapshot(q, snap => {
  if (firstLoad) { firstLoad = false; return; }
  snap.forEach(doc => {
    const k = doc.data();
    if (Date.now() - k.time < 10000) showReceive(k);
  });
});

// === Notifications ===
document.getElementById('notif-btn').addEventListener('click', async () => {
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return;
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const messaging = getMessaging(app);
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      if (token) {
        await addDoc(collection(db, 'tokens'), { token, time: Date.now() });
        document.getElementById('notif-btn').textContent = '🔔 Notifications On';
        document.getElementById('notif-btn').classList.add('on');
      }
    } catch (err) {
      console.log('Notify failed:', err);
      document.getElementById('notif-btn').textContent = '🔔 Failed';
    }
  }
});
onMessage(getMessaging(app), p => console.log('Foreground:', p));
</script>

</body>
</html>
