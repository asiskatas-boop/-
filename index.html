<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: #2A1F1A;
    --ink-soft: #6B5A4E;
    --cream: #FDF8F3;
    --cream-deep: #F5EBE0;
    --rose: #C94060;
    --rose-deep: #A82E4C;
    --hairline: #E8DDD1;
    --pad-x: clamp(16px, 5vw, 24px);
  }

  html {
    height: 100%;
    overflow: hidden;
  }

  body {
    height: 100%;
    height: 100dvh;
    min-height: 100dvh;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
    font-weight: 400;
    -webkit-tap-highlight-color: transparent;
  }

  /* ========= SEND VIEW ========= */
  #send-view {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-top: max(14px, env(safe-area-inset-top));
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  /* Topbar */
  .topbar {
    padding: 10px var(--pad-x) 18px;
    flex-shrink: 0;
  }

  .brand {
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: clamp(22px, 6vw, 26px);
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.8px;
    line-height: 1.1;
  }

  .brand .accent {
    color: var(--rose);
  }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 0 var(--pad-x) 16px;
    flex-shrink: 0;
  }

  .tab {
    padding: 12px 4px;
    background: transparent;
    border: 1.5px solid var(--hairline);
    border-radius: 14px;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: clamp(11px, 3vw, 12px);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }

  .tab-emoji {
    font-size: clamp(20px, 5.5vw, 22px);
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .tab.active {
    border-color: var(--rose);
    background: var(--rose);
    color: white;
    transform: translateY(-2px);
  }

  .tab.active .tab-emoji {
    transform: scale(1.2) rotate(-8deg);
  }

  .tab:active {
    transform: scale(0.95);
  }

  /* Preview */
  .preview {
    margin: 0 var(--pad-x) 18px;
    height: clamp(150px, 42vw, 190px);
    background: var(--cream-deep);
    border-radius: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .preview::before {
    content: '';
    position: absolute;
    top: -40%;
    left: -20%;
    width: 60%;
    height: 180%;
    background: radial-gradient(circle, rgba(201,64,96,0.12), transparent 70%);
    pointer-events: none;
  }

  .preview::after {
    content: '';
    position: absolute;
    bottom: -30%;
    right: -10%;
    width: 50%;
    height: 140%;
    background: radial-gradient(circle, rgba(201,64,96,0.08), transparent 70%);
    pointer-events: none;
  }

  #preview-icon {
    width: clamp(80px, 24vw, 100px);
    height: clamp(80px, 24vw, 100px);
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 6px 16px rgba(201,64,96,0.25));
  }

  #preview-emoji {
    font-size: clamp(70px, 22vw, 90px);
    line-height: 1;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 6px 16px rgba(201,64,96,0.25));
  }

  #draw-canvas {
    width: 88%;
    max-width: 340px;
    aspect-ratio: 600 / 280;
    height: auto;
    background: white;
    border-radius: 16px;
    touch-action: none;
    cursor: crosshair;
    display: none;
    position: relative;
    z-index: 1;
    box-shadow: 0 2px 8px rgba(42,31,26,0.06);
  }

  /* Sections */
  .section {
    padding: 0 var(--pad-x) 16px;
    flex-shrink: 0;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }

  .section-label {
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: clamp(14px, 4vw, 15px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
  }

  .section-hint {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  /* Color grid */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: clamp(4px, 1.2vw, 6px);
  }

  .color-dot {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1.5px solid transparent;
  }

  .color-dot.selected {
    border-color: var(--ink);
    transform: scale(1.15);
    box-shadow: 0 0 0 2px var(--cream), 0 0 0 4px var(--rose);
  }

  #custom-color {
    width: 100%;
    height: 36px;
    border: 1.5px solid var(--hairline);
    border-radius: 12px;
    cursor: pointer;
    background: white;
    margin-top: 10px;
    padding: 2px;
  }

  #custom-color::-webkit-color-swatch-wrapper { padding: 0; }
  #custom-color::-webkit-color-swatch { border: none; border-radius: 9px; }
  #custom-color::-moz-color-swatch { border: none; border-radius: 9px; }

  /* Photo */
  .photo-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .media-btn {
    flex: 1;
    padding: 13px 18px;
    background: white;
    border: 1.5px solid var(--hairline);
    border-radius: 14px;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .media-btn::after {
    content: '→';
    font-size: 16px;
    color: var(--rose);
    transition: transform 0.2s;
  }

  .media-btn:active {
    background: var(--cream-deep);
    transform: scale(0.98);
  }

  .media-btn:active::after {
    transform: translateX(3px);
  }

  #preview-img {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: none;
    object-fit: cover;
    border: 1.5px solid var(--hairline);
  }

  #preview-img.show { display: block; }

  #file-input { display: none; }

  /* Location */
  .loc-toggle {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }

  .loc-toggle button {
    padding: 11px 4px;
    border: 1.5px solid var(--hairline);
    background: white;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 12px;
    transition: all 0.2s;
  }

  .loc-toggle button.active {
    background: var(--ink);
    border-color: var(--ink);
    color: white;
  }

  #custom-loc {
    display: none;
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--hairline);
    background: white;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: 12px;
  }

  #custom-loc::placeholder { color: #B8A89A; }
  #custom-loc.show { display: block; }
  #custom-loc:focus { outline: none; border-color: var(--rose); }

  /* Actions */
  .actions {
    padding: 8px var(--pad-x) 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: auto;
    flex-shrink: 0;
  }

  #notif-btn {
    padding: 13px 18px;
    background: transparent;
    border: 1.5px solid var(--hairline);
    border-radius: 14px;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  #notif-btn::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--hairline);
    transition: background 0.2s;
  }

  #notif-btn.on {
    border-color: var(--rose);
    color: var(--rose);
  }

  #notif-btn.on::before {
    background: var(--rose);
    box-shadow: 0 0 8px rgba(201,64,96,0.5);
  }

  #notif-btn:active { transform: scale(0.98); }

  #send-btn {
    padding: 18px 28px;
    background: var(--rose);
    border: none;
    border-radius: 18px;
    color: white;
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: clamp(15px, 4.2vw, 17px);
    font-weight: 800;
    letter-spacing: -0.2px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 20px rgba(201,64,96,0.28);
    position: relative;
    overflow: hidden;
  }

  #send-btn::after {
    content: '💋';
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #send-btn:active {
    transform: scale(0.97);
    box-shadow: 0 3px 10px rgba(201,64,96,0.3);
  }

  #send-btn:active::after {
    transform: translateY(-50%) scale(1.3) rotate(-15deg);
  }

  #send-btn:disabled {
    background: var(--hairline);
    color: var(--ink-soft);
    box-shadow: none;
  }

  #send-btn:disabled::after {
    opacity: 0.4;
  }

  /* === Love burst animation === */
  .burst-heart {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    z-index: 9999;
    animation: burstOut 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    will-change: transform, opacity;
  }

  @keyframes burstOut {
    0% {
      transform: translate(0, 0) scale(0.5) rotate(0deg);
      opacity: 1;
    }
    60% { opacity: 1; }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot));
      opacity: 0;
    }
  }

  #send-btn.bursting {
    animation: sendPulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes sendPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ========= RECEIVE VIEW ========= */
  #receive-view {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 28px env(safe-area-inset-bottom);
    gap: 36px;
    z-index: 100;
    animation: fadeIn 0.4s ease;
    overflow-y: auto;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  #kiss-display {
    width: clamp(150px, 50vw, 200px);
    height: clamp(150px, 50vw, 200px);
    filter: drop-shadow(0 12px 32px rgba(201,64,96,0.3));
    flex-shrink: 0;
  }

  #kiss-display.bounce { animation: pop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes pop {
    0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
    50% { transform: scale(1.12) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  #emoji-display {
    font-size: clamp(140px, 45vw, 180px);
    line-height: 1;
    display: none;
    filter: drop-shadow(0 12px 32px rgba(201,64,96,0.3));
    flex-shrink: 0;
  }

  #emoji-display.bounce { animation: pop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1); }

  #location-display {
    color: var(--ink-soft);
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    max-width: 90vw;
    line-height: 1.6;
    padding: 12px 20px;
    background: white;
    border-radius: 16px;
    border: 1.5px solid var(--hairline);
  }

  #location-display:empty { display: none; }

  #location-display a {
    color: var(--rose);
    text-decoration: none;
    font-weight: 600;
  }

  #location-display img {
    max-width: min(80vw, 320px);
    max-height: 45vh;
    border-radius: 20px;
    margin: 8px auto 0;
    display: block;
    object-fit: contain;
    box-shadow: 0 8px 24px rgba(42,31,26,0.12);
  }

  #back-btn {
    padding: 14px 32px;
    background: var(--ink);
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.2px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  #back-btn:active {
    transform: scale(0.97);
    background: var(--rose);
  }

  .hidden { display: none !important; }

  /* Very small phones (< 360px) */
  @media (max-width: 360px) {
    :root { --pad-x: 14px; }
    .preview { border-radius: 22px; height: 140px; }
    .tab { border-radius: 12px; padding: 10px 3px; }
    .media-btn, #notif-btn { padding: 11px 14px; font-size: 12px; border-radius: 12px; }
    #send-btn { padding: 16px 22px; border-radius: 16px; }
  }

  /* Very short landscape */
  @media (max-height: 500px) and (orientation: landscape) {
    .preview { height: 100px; }
    #preview-icon { width: 60px; height: 60px; }
    #preview-emoji { font-size: 50px; }
    .topbar { padding: 8px var(--pad-x) 10px; }
    .brand { font-size: 18px; }
    .section { padding-bottom: 10px; }
  }
</style>
</head>

function escapeHtml(s) {

    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

}

// === Love burst animation ===
function triggerLoveBurst(originEl) {
  const emojis = ['💕', '💖', '💗', '💓', '❤️', '💝', '💘'];
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  originEl.classList.remove('bursting');
  void originEl.offsetWidth;
  originEl.classList.add('bursting');

  const count = 14;
  for (let i = 0; i < count; i++) {
    const heart = document.createElement('div');
    heart.className = 'burst-heart';
    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];

    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
    const distance = 100 + Math.random() * 120;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance - 40;
    const rot = (Math.random() - 0.5) * 360;

    heart.style.left = cx + 'px';
    heart.style.top = cy + 'px';
    heart.style.setProperty('--tx', tx + 'px');
    heart.style.setProperty('--ty', ty + 'px');
    heart.style.setProperty('--rot', rot + 'deg');
    heart.style.animationDelay = (Math.random() * 0.15) + 's';
    heart.style.fontSize = (20 + Math.random() * 16) + 'px';

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1500);
  }
}

// === Canvas ===
const canvas = document.getElementById('draw-canvas');
canvas.width = 600;
canvas.height = 280;
const ctx = canvas.getContext('2d');
ctx.lineWidth = 6;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = selectedColor;

// === Color dots ===
const colorRow = document.getElementById('color-row');
colors.forEach(c => {
  const dot = document.createElement('div');
  dot.className = 'color-dot' + (c === selectedColor ? ' selected' : '');
  dot.style.background = c;
  if (c === '#FDF8F3') dot.style.border = '1.5px solid #E8DDD1';
  dot.onclick = () => {
    selectedColor = c;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    dot.classList.add('selected');
    document.getElementById('custom-color').value = c;
    applyColor();
  };
  colorRow.appendChild(dot);
});

function applyColor() {
  document.getElementById('preview-path').setAttribute('fill', selectedColor);
  ctx.strokeStyle = selectedColor;
}

document.getElementById('custom-color').addEventListener('input', e => {
  selectedColor = e.target.value;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  applyColor();
});

// === Tabs ===
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  selectedType = btn.dataset.type;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
});

function updatePreview() {
  const svg = document.getElementById('preview-icon');
  const emoji = document.getElementById('preview-emoji');
  const cv = document.getElementById('draw-canvas');

  if (selectedType === 'kiss') {
    svg.style.display = 'block';
    emoji.style.display = 'none';
    cv.style.display = 'none';
  } else if (selectedType === 'hug') {
    svg.style.display = 'none';
    emoji.style.display = 'block';
    emoji.textContent = '🤗';
    cv.style.display = 'none';
  } else if (selectedType === 'papoi') {
    svg.style.display = 'none';
    emoji.style.display = 'block';
    emoji.textContent = '🍌';
    cv.style.display = 'none';
  } else {
    svg.style.display = 'none';
    emoji.style.display = 'none';
    cv.style.display = 'block';
  }
}
updatePreview();

// === Drawing ===
let drawing = false;
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});
canvas.addEventListener('pointerup', e => {
  drawing = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointercancel', () => { drawing = false; });

function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
function isCanvasEmpty() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < data.length; i += 4) if (data[i] !== 0) return false;
  return true;
}

// === Location ===
document.getElementById('loc-toggle').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  locMode = e.target.dataset.mode;
  document.querySelectorAll('#loc-toggle button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('custom-loc').classList.toggle('show', locMode === 'text');
  if (locMode !== 'text') document.getElementById('custom-loc').value = '';
});

// === Photo ===
document.getElementById('file-input').addEventListener('change', e => {
  selectedFile = e.target.files[0] || null;
  const preview = document.getElementById('preview-img');
  if (selectedFile) {
    if (selectedFile.size > MAX_FILE_MB * 1024 * 1024) {
      alert(`Photo too big (max ${MAX_FILE_MB}MB). Choose a smaller one.`);
      selectedFile = null;
      e.target.value = '';
      preview.classList.remove('show');
      return;
    }
    preview.src = URL.createObjectURL(selectedFile);
    preview.classList.add('show');
    clearCanvas();
  } else preview.classList.remove('show');
});

// === Helpers ===
async function fetchWithTimeout(url, options, ms = 15000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timeoutId);
  }
}

async function uploadToImgBB(formData) {
  try {
    const res = await fetchWithTimeout(
      `https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,
      { method: 'POST', body: formData },
      20000
    );
    if (!res.ok) return null;
    const data = await res.json();
    return data?.data?.url || null;
  } catch { return null; }
}

async function fetchRandomMinionGif() {
  try {
    const res = await fetchWithTimeout(
      `https://api.giphy.com/v1/gifs/random?api_key=${GIPHY_KEY}&tag=minion&rating=g`,
      {},
      4000
    );
    if (!res.ok) return null;
    const data = await res.json();
    return data?.data?.images?.original?.url || null;
  } catch { return null; }
}

// === Send ===
document.getElementById('send-btn').addEventListener('click', async () => {
  const now = Date.now();
  if (now - lastSendTime < 1000) return;
  lastSendTime = now;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending';

  triggerLoveBurst(sendBtn);

  try {
    let location = null;
    if (locMode === 'gps') {
      try {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 })
        );
        location = { type: 'gps', lat: pos.coords.latitude, lon: pos.coords.longitude };
      } catch {}
    } else if (locMode === 'text') {
      const text = document.getElementById('custom-loc').value.trim();
      if (text) location = { type: 'text', label: text };
    }

    let mediaUrl = null;
    if (selectedFile) {
      const fd = new FormData();
      fd.append('image', selectedFile);
      mediaUrl = await uploadToImgBB(fd);
    } else if (selectedType === 'papoi') {
      mediaUrl = await fetchRandomMinionGif();
    } else if (selectedType === 'draw' && !isCanvasEmpty()) {
      const base64 = canvas.toDataURL('image/png').split(',')[1];
      const fd = new FormData();
      fd.append('image', base64);
      mediaUrl = await uploadToImgBB(fd);
    }

    const kissData = {
      type: selectedType,
      color: selectedColor,
      location,
      mediaUrl,
      time: now
    };

    const docRef = doc(collection(db, 'kisses'));
    lastShownDocId = docRef.id;
    await setDoc(docRef, kissData);

    selectedFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('preview-img').classList.remove('show');
    document.getElementById('custom-loc').value = '';
    clearCanvas();

    showReceive(kissData);
  } catch (err) {
    console.error('Send failed:', err);
    alert('Send failed. Check internet.');
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
});

// === Receive ===
function showReceive(k) {
  document.getElementById('send-view').classList.add('hidden');
  document.getElementById('receive-view').classList.remove('hidden');

  const svg = document.getElementById('kiss-display');
  const emoji = document.getElementById('emoji-display');
  svg.classList.remove('bounce');
  emoji.classList.remove('bounce');

  if (k.mediaUrl) {
    svg.style.display = 'none';
    emoji.style.display = 'none';
  } else if (k.type === 'hug') {
    svg.style.display = 'none';
    emoji.style.display = 'block';
    emoji.textContent = '🤗';
    void emoji.offsetWidth;
    emoji.classList.add('bounce');
  } else {
    svg.style.display = 'block';
    emoji.style.display = 'none';
    document.getElementById('kiss-path').setAttribute('fill', k.color || '#C94060');
    void svg.offsetWidth;
    svg.classList.add('bounce');
  }

  let html = '';
  if (k.location) {
    if (k.location.type === 'gps') {
      html += `<a href="https://maps.google.com/?q=${k.location.lat},${k.location.lon}" target="_blank" rel="noopener">📍 ${k.location.lat.toFixed(3)}, ${k.location.lon.toFixed(3)}</a>`;
    } else if (k.location.type === 'text') {
      html += `📍 ${escapeHtml(k.location.label)}`;
    }
  }
  if (k.mediaUrl) {
    html += `<img src="${escapeHtml(k.mediaUrl)}" alt="" onerror="this.style.display='none'">`;
  }
  document.getElementById('location-display').innerHTML = html || (k.type === 'hug' ? 'A hug for you 🤗' : '');
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('receive-view').classList.add('hidden');
  document.getElementById('send-view').classList.remove('hidden');
});

// === Firestore listener ===
let unsubscribeSnapshot = null;

function startListener() {
  const q = query(collection(db, 'kisses'), orderBy('time', 'desc'), limit(1));
  unsubscribeSnapshot = onSnapshot(q,
    snap => {
      snap.forEach(d => {
        if (d.id === lastShownDocId) return;
        showReceive(d.data());
        lastShownDocId = d.id;
      });
    },
    err => {
      console.error('Snapshot error, retrying in 3s:', err);
      if (unsubscribeSnapshot) { try { unsubscribeSnapshot(); } catch {} }
      setTimeout(startListener, 3000);
    }
  );
}
startListener();

// === Notifications ===
document.getElementById('notif-btn').addEventListener('click', async () => {
  if (notifInitialized || notifPending) return;
  notifPending = true;
  const btn = document.getElementById('notif-btn');
  btn.textContent = 'Working...';

  try {
    await window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.Notifications.requestPermission();
      const granted = OneSignal.Notifications.permission;
      if (granted) {
        btn.textContent = 'Notifications On';
        btn.classList.add('on');
        notifInitialized = true;
      } else {
        btn.textContent = 'Tap to Retry';
      }
    });
  } catch (err) {
    console.error('Notify failed:', err);
    btn.textContent = 'Tap to Retry';
  } finally {
    notifPending = false;
  }
});
</script>
